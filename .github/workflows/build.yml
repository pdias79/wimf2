name: Build and test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Wimf.slnx
      - name: Build
        run: dotnet build Wimf.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Wimf.slnx --configuration Release --no-build
