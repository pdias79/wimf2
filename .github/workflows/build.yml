name: Build and test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Wimf.slnx
      - name: Build
        run: dotnet build Wimf.slnx --configuration Release --no-restore
      - name: Build Windows tray launcher
        if: runner.os == 'Windows'
        run: dotnet build src/Wimf.Tray/Wimf.Tray.csproj --configuration Release
      - name: Test
        run: dotnet test Wimf.slnx --configuration Release --no-build
      - name: Benchmark smoke test
        run: dotnet run --project benchmarks/Wimf.Benchmarks --configuration Release --no-build -- --count 1000 --folders 100 --depth 8 --iterations 1 --profile-refresh

      - name: Publish single Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Publish-WindowsSingleExe.ps1
      - name: Verify portable Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "artifacts/windows/Wimf.exe"
          if (-not (Test-Path $exe)) { throw "Wimf.exe missing" }
          if ((Get-ChildItem artifacts/windows -File).Count -ne 1) { throw "Expected one distributable file" }
      - name: Upload portable Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Wimf-win-x64-single-exe
          path: artifacts/windows/Wimf.exe
          if-no-files-found: error

      - name: Initialize MSVC for experimental C++ launcher
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Experiment Native AOT server publish (non-blocking)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/Test-WindowsNativeAot.ps1
      - name: Upload Native AOT feasibility report
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: Wimf-win-x64-aot-experiment
          path: |
            artifacts/windows-aot-experiment/result.txt
            artifacts/windows-aot-experiment/publish.log
            artifacts/windows-aot-experiment/Wimf-AOT.exe
            artifacts/windows-aot-experiment/Wimf-Native.exe
          if-no-files-found: warn
