name: Build and test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Wimf.slnx
      - name: Build
        run: dotnet build Wimf.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Wimf.slnx --configuration Release --no-build
      - name: Benchmark smoke test
        run: dotnet run --project benchmarks/Wimf.Benchmarks --configuration Release --no-build -- --count 1000 --folders 100 --depth 8 --iterations 1 --profile-refresh

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Publish native Windows executable (required)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-WindowsNativeAot.ps1
      - name: Verify native Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "artifacts/windows/Wimf.exe"
          if (-not (Test-Path $exe)) { throw "Native Wimf.exe missing" }
          if ((Get-ChildItem artifacts/windows -File).Count -ne 1) { throw "Expected exactly one distributable file" }
      - name: Upload native Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Wimf-win-x64-native
          path: artifacts/windows/Wimf.exe
          if-no-files-found: error
